name: 测试和打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '要发布的版本号，例如 1.0.0（留空就只打包、不发布）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: 运行测试
        run: npm test

  windows-app:
    name: 打包 Windows 安装包
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 确定要不要发布
        id: release
        shell: bash
        env:
          INPUT: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$INPUT" ]]; then
            VERSION="${INPUT#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: 打包
        run: npm run dist:win
      - name: 测试打包好的桌面版
        run: node test/packaged-app.test.js -- "dist/win-unpacked/AI Roundtable.exe"
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: AI-Roundtable-Windows
          path: dist/*.exe
          if-no-files-found: error
      - name: 发布 Release
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --clobber
          else
            gh release create "$TAG" dist/*.exe --target "$GITHUB_SHA" \
              --title "AI 圆桌 $TAG" \
              --notes "Windows 安装包：下载下面的 AI-Roundtable-Setup-*.exe，双击安装。第一次运行如果出现“Windows 已保护你的电脑”，点「更多信息」→「仍要运行」。"
          fi
